<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Send SMS</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  input, select, button { margin: 5px 0; padding: 8px; width: 250px; }
</style>
</head>
<body>

  <input id="message" placeholder="Сообщение">
  <input id="user" placeholder="Имя">
  <select id="smsType">
    <option value="normal">normal</option>
    <option value="vip">vip</option>
    <option value="glamour">glamour</option>
    <option value="express">express</option>
  </select>
  <button onclick="sendMessage()">Отправить</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    function sendMessage() {
      const message = document.getElementById('message').value.trim();
      const user = document.getElementById('user').value.trim();
      const smsType = document.getElementById('smsType').value;

      if (!message) return;

      btv.sendMessage({ message, user, displayName: user || 'BTV', smsType })
        .catch(function(err) { console.error(err); });

      document.getElementById('message').value = '';
      document.getElementById('user').value = '';
      document.getElementById('smsType').value = 'normal';
    }
  </script>

</body>
</html>

name: Check track order scripts

on:
  push:
    branches:
      - feature/neon-track-orders-2026-10-16
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public form script
        run: node --check track-order.js
      - name: Check moderation script
        run: node --check admin/track-requests.js

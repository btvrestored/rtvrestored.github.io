<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Страница не найдена">
  <title>404 - RUSONG TV: Project Restored</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="inner.css">
</head>
<body class="inner page-404">
  <header class="site-header">
    <div class="logo">
      <a href="index.html">
        <img src="logo.png" alt="RUSONG TV" height="34">
      </a>
    </div>
    <nav id="siteNav">
        <a href="shows.html" data-i18n="nav_shows">Программы</a>
        <a href="repeats.html" data-i18n="nav_repeats">Повторы</a>
        <a href="identity.html" data-i18n="nav_identity">Архив</a>
        <a href="about.html" data-i18n="nav_about">О телеканале</a>
        <a href="order.html" data-i18n="nav_order">Заказать клип</a>
    </nav>
    <div class="top-right">
      <div class="lang">
        language:
        <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
        <button class="lang-btn active" onclick="setLang('ru')">🇷🇺 RU</button>
      </div>
    </div>
    <button class="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="siteNav"><span></span><span></span><span></span></button>
  </header>

  <main class="inner-main">
    <div class="err">
      <div class="code">404</div>
      <h1 data-i18n="e_h">Эта частота молчит</h1>
      <p data-i18n="e_p">Страница не найдена или уже ушла из эфира. Вернитесь на главную или загляните в раздел «О телеканале».</p>
      <div class="actions">
        <a class="btn primary" href="index.html" data-i18n="e_home">На главную</a>
        <a class="btn secondary" href="about.html" data-i18n="nav_about">О телеканале</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span data-i18n="footer">Представлено командой BM-PR. Не имеет отношения к BRIDGE MEDIA.</span>
  </footer>

  <script>
    var i18n = {
  "en": {
    "nav_shows": "Shows",
    "nav_repeats": "Repeats",
    "nav_identity": "Archive",
    "nav_about": "About",
    "nav_order": "Order clip",
    "footer": "Presented by BM-PR. Not affiliated with BRIDGE MEDIA.",
    "e_h": "This frequency is silent",
    "e_p": "The page was not found or has already left the air. Go back to the home page or visit the About section.",
    "e_home": "Home"
  },
  "ru": {
    "nav_shows": "Программы",
    "nav_repeats": "Повторы",
    "nav_identity": "Архив",
    "nav_about": "О телеканале",
    "nav_order": "Заказать клип",
    "footer": "Представлено командой BM-PR. Не имеет отношения к BRIDGE MEDIA.",
    "e_h": "Эта частота молчит",
    "e_p": "Страница не найдена или уже ушла из эфира. Вернитесь на главную или загляните в раздел «О телеканале».",
    "e_home": "На главную"
  }
};

    function setLang(lang) {
      if (!i18n[lang]) lang = 'ru';
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.getAttribute('onclick').indexOf("'" + lang + "'") !== -1);
      });
      try { localStorage.setItem('lang', lang); } catch (e) {}
    }

    var savedLang = 'ru';
    try { savedLang = localStorage.getItem('lang') || 'ru'; } catch (e) {}
    setLang(savedLang);
  </script>
  <script src="menu.js" defer></script>
</body>
</html>
